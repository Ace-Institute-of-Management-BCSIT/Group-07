<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SaveABeat — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#D62B2B;--red-dark:#a81e1e;--red-light:#fdecea;--ink:#1a1a1a;--mid:#555;--soft:#888;--border:#e8e8e8;--bg:#fdecea;--white:#fff;--ff-head:'Playfair Display',serif;--ff-body:'DM Sans',sans-serif}
body{font-family:var(--ff-body);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--white);border-radius:16px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(0,0,0,.08)}
.card-logo{text-align:center;margin-bottom:24px}
.card-logo a{display:inline-flex;align-items:center;gap:8px;font-family:var(--ff-head);font-size:1.4rem;font-weight:700;color:var(--red);text-decoration:none}
.card h2{font-family:var(--ff-head);font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:6px;color:var(--ink)}
.card .sub{text-align:center;font-size:.88rem;color:var(--soft);margin-bottom:28px;line-height:1.5}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:.88rem;font-weight:500;color:var(--ink);margin-bottom:6px}
.form-group .input-wrap{position:relative}
.form-group input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font:400 .92rem var(--ff-body);background:#f5f5f5;outline:none;transition:border-color .2s,background .2s;color:var(--ink)}
.form-group input:focus{border-color:var(--red);background:var(--white)}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--soft);display:flex;align-items:center;padding:0;transition:color .2s}
.toggle-pw:hover{color:var(--ink)}
.btn-full{width:100%;background:var(--red);color:var(--white);border:none;font:600 .95rem var(--ff-body);padding:13px;border-radius:8px;cursor:pointer;transition:background .2s;margin-top:4px}
.btn-full:hover{background:var(--red-dark)}
.card-footer{text-align:center;font-size:.85rem;color:var(--mid);margin-top:18px}
.card-footer a{color:var(--red);font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}
.demo-note{text-align:center;font-size:.78rem;color:var(--soft);margin-top:12px}
.error-msg{background:#fdecea;border:1px solid #f5c6c6;color:var(--red);font-size:.82rem;padding:10px 14px;border-radius:6px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="card-logo">
    <a href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg>
      SaveABeat
    </a>
  </div>
  <h2 id="loginTitle">Welcome Back</h2>
  <p class="sub" id="loginSubtitle">Sign in to your SaveABeat account to continue helping save lives</p>

  <div class="error-msg" id="errorMsg">Invalid email or password. Please try again.</div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email" autocomplete="email"/>
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Enter your password"/>
      <button class="toggle-pw" onclick="togglePw('password',this)" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pwIcon">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn-full" onclick="handleLogin()" type="button">Sign In</button>

  <p class="card-footer" id="loginFooter">Don't have an account? <a href="register.html">Sign up here</a></p>
  <p class="demo-note">Use your registered email and password.</p>
</div>

<script>
const loginRole = new URLSearchParams(location.search).get('role') || 'donor';

function togglePw(id,btn){
  const input=document.getElementById(id);
  input.type=input.type==="password"?"text":"password";
}

function applyLoginRole(){
  const title=document.getElementById('loginTitle');
  const subtitle=document.getElementById('loginSubtitle');
  const footer=document.getElementById('loginFooter');

  if(loginRole === 'admin'){
    title.textContent='Admin Login';
    subtitle.textContent='Use the seeded admin credentials to sign in.';
    footer.textContent='Admin accounts are pre-created.';
    return;
  }

  if(loginRole === 'org'){
    title.textContent='Organization Login';
    subtitle.textContent='Sign in with your organization email and password.';
    footer.innerHTML="Don't have an account? <a href=\"register.html?role=org\">Sign up here</a>";
    return;
  }

  title.textContent='Donor Login';
  subtitle.textContent='Sign in to your donor account to continue helping save lives.';
  footer.innerHTML="Don't have an account? <a href=\"register.html?role=donor\">Sign up here</a>";
}

async function readJsonResponse(response){
  const contentType=response.headers.get('content-type') || '';
  if(contentType.includes('application/json')){
    return response.json();
  }
  const text=await response.text();
  if(text.trimStart().startsWith('<!DOCTYPE') || text.trimStart().startsWith('<html')){
    throw new Error('Server returned a page instead of data. Start the backend with npm start in BackEnd, then open http://localhost:3000/login.html');
  }
  throw new Error('Unexpected server response. Make sure the backend is running.');
}

async function handleLogin(){
  const email=document.getElementById("email").value.trim().toLowerCase();
  const pw=document.getElementById("password").value;
  const err=document.getElementById("errorMsg");
  if(!email||!pw){err.textContent="Please fill in all fields.";err.style.display="block";return}
  try{
    const response=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pw})
    });
    const payload=await readJsonResponse(response);
    if(!response.ok){
      err.textContent=payload.message||'Invalid email or password.';
      err.style.display='block';
      return;
    }
    if(loginRole !== 'admin' && payload.user.role !== loginRole){
      if(loginRole === 'org'){
        err.textContent='This account is not an organization account. Use the donor login page or register as an organization.';
      }else if(loginRole === 'donor'){
        err.textContent='This account is not a donor account. Use the organization login page or register as a donor.';
      }else{
        err.textContent='Please use the correct account type for this login page.';
      }
      err.style.display='block';
      return;
    }
    err.style.display='none';
    let storedUser=payload.user;
    try{
      const meResponse=await fetch(`/api/me?email=${encodeURIComponent(storedUser.email)}`);
      const mePayload=await readJsonResponse(meResponse);
      if(meResponse.ok && mePayload.user){
        storedUser=mePayload.user;
      }
    }catch(_error){}
    sessionStorage.setItem('saveabeatUser', JSON.stringify(storedUser));
    location.href = storedUser.role === 'org' ? 'org-dashboard.html' : 'donor-dashboard.html';
  }catch(error){
    err.textContent=error.message||'Unable to reach the server. Make sure the backend is running.';
    err.style.display='block';
  }
}
document.addEventListener("keydown",e=>{if(e.key==="Enter")handleLogin()});
document.getElementById('loginFooter')?.querySelector('a')?.setAttribute('href', loginRole === 'org' ? 'register.html?role=org' : 'register.html?role=donor');
applyLoginRole();
</script>
</body>
</html>
