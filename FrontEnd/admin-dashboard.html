<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SaveABeat</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23E3242B' d='M32 56s-24-14.8-24-31c0-7.2 5.4-12 12-12 4.4 0 7.4 2.3 9 4.5 1.6-2.2 4.6-4.5 9-4.5 6.6 0 12 4.8 12 12 0 16.2-24 31-24 31z'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#E3242B;
  --red-dark:#b21f23;
  --red-soft:#fff1f1;
  --bg:#f5f7fb;
  --panel:#fff;
  --ink:#171717;
  --mid:#555;
  --soft:#7d7d7d;
  --border:#e8e8ec;
  --green:#1f7a3d;
  --amber:#b26a00;
  --blue:#245bdb;
  --gray:#5f6b7a;
  --shadow:0 14px 36px rgba(16,24,40,.06);
  --shadow-soft:0 8px 18px rgba(16,24,40,.04);
  --ff-head:'Playfair Display',serif;
  --ff-body:'DM Sans',sans-serif;
  --radius:18px;
}
html,body{min-height:100%}
body{
  font-family:var(--ff-body);
  background:
    radial-gradient(circle at top left, rgba(227,36,43,.08), transparent 30%),
    linear-gradient(180deg,#fff6f6 0%,#fafafa 34%,#f8f9fb 100%);
  color:var(--ink);
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
.topbar{
  position:sticky;top:0;z-index:120;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:68px;padding:0 24px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(232,232,236,.9);
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:var(--ff-head);font-size:1.26rem;font-weight:700;
  color:var(--ink);white-space:nowrap;
}
.brand svg{color:var(--red);flex-shrink:0}
.main-nav{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
}
.main-nav button{
  border:1px solid transparent;background:transparent;color:var(--mid);
  padding:10px 14px;border-radius:999px;font-weight:600;transition:.2s ease;
}
.main-nav button:hover{background:#fafafa;color:var(--ink)}
.main-nav button.active{
  background:var(--red-soft);color:var(--red);
  border-color:#f3d0d0;
}
.profile-shell{position:relative;min-width:210px}
.profile-trigger{
  width:100%;height:44px;border:1px solid var(--border);border-radius:12px;
  background:var(--panel);color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;
  box-shadow:0 2px 8px rgba(16,24,40,.04);
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.profile-trigger:hover{border-color:#d8d8df;box-shadow:0 6px 14px rgba(16,24,40,.06);transform:translateY(-1px)}
.profile-trigger-left{display:flex;align-items:center;gap:10px;min-width:0}
.profile-initial{
  width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.95rem;font-weight:700;
}
.profile-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-arrow{display:inline-flex;align-items:center;justify-content:center;color:var(--mid);transition:transform .2s}
.profile-shell.open .profile-arrow{transform:rotate(180deg)}
.profile-menu{
  position:absolute;left:0;right:0;top:calc(100% + 8px);
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 16px 40px rgba(16,24,40,.12);padding:6px;display:none;z-index:130;
}
.profile-menu.open{display:block}
.profile-menu button{
  width:100%;border:none;background:none;border-radius:10px;padding:11px 12px;
  text-align:left;font-weight:600;color:var(--ink);transition:background .2s;
}
.profile-menu button:hover{background:#f7f7f8}
.page{max-width:1420px;margin:0 auto;padding:28px 24px 56px}
.page-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin-bottom:18px;
}
.page-head h1{
  font-family:var(--ff-head);font-size:2.25rem;line-height:1.1;margin-bottom:8px;
}
.notice{
  min-width:280px;max-width:520px;
  border-radius:14px;padding:13px 14px;font-weight:600;
  border:1px solid transparent;box-shadow:var(--shadow-soft);
}
.notice.success{background:#edf8f0;border-color:#d4ecd9;color:var(--green)}
.notice.error{background:#fff1f1;border-color:#f0c9c9;color:#a61b1b}
.notice.info{background:#eff5ff;border-color:#d2e0ff;color:#1848b0}
.workspace{
  display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start;
}
.side-card,.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.side-card{padding:18px;position:sticky;top:86px}
.side-title{
  font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);
  margin-bottom:12px;
}
.subnav{display:flex;flex-direction:column;gap:10px}
.subnav button{
  width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:14px;
  padding:12px 14px;font-weight:700;color:var(--ink);transition:all .2s ease;
}
.subnav button:hover{border-color:#d8d8df;transform:translateY(-1px)}
.subnav button.active{
  border-color:#f0c9c9;background:var(--red-soft);color:var(--red);
  box-shadow:inset 0 0 0 1px rgba(227,36,43,.06);
}
.subnav small{display:block;font-weight:500;color:var(--soft);margin-top:4px}
.panel{padding:18px;min-height:560px}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px;
}
.search-shell{
  flex:1;min-width:280px;position:relative;
}
.search-shell svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--soft);
}
.search-shell input{
  width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;
  padding:0 44px 0 40px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;
}
.search-shell input:focus{border-color:#e4b5b7;box-shadow:0 0 0 3px rgba(227,36,43,.08)}
.toolbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clear-btn,.btn{
  border:none;border-radius:12px;padding:11px 14px;font-weight:700;
  transition:all .2s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.clear-btn{
  background:#f7f7f8;color:var(--ink);border:1px solid var(--border);
}
.clear-btn:hover{border-color:#d4d4da;transform:translateY(-1px)}
.clear-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.results-meta{color:var(--soft);font-size:.92rem}
.loading,.empty-state,.error-state{
  border:1px dashed #d9d9df;border-radius:16px;padding:28px 18px;
  text-align:center;background:#fcfcfd;color:var(--mid);
}
.error-state{border-color:#f0c9c9;background:#fff6f6;color:#a61b1b}
.record-list{
  display:flex;flex-direction:column;gap:14px;
}
.record-card{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px;border:1px solid var(--border);border-radius:18px;background:#fff;
  box-shadow:var(--shadow-soft);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.record-card:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 32px rgba(16,24,40,.08);
  border-color:#dddde4;
}
.record-card-main{
  display:flex;flex-direction:column;gap:10px;min-width:0;flex:1;
}
.record-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.record-card-copy{
  display:flex;flex-direction:column;gap:4px;min-width:0;
}
.record-card-copy strong,
.record-card-copy h3{
  font-size:1.02rem;line-height:1.35;
}
.record-card-copy span,
.record-card-copy p{
  color:var(--mid);font-size:.92rem;
}
.record-card-meta{
  display:flex;flex-wrap:wrap;gap:8px;
}
.record-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 10px;border-radius:999px;border:1px solid #ececf1;background:#fafafa;
  color:var(--mid);font-size:.8rem;font-weight:700;
}
.record-card-actions{
  display:flex;align-items:flex-start;gap:10px;flex-shrink:0;
}
.table-shell{overflow:auto;border:1px solid var(--border);border-radius:16px;background:#fff}
.data-table{width:100%;border-collapse:collapse;min-width:920px}
.data-table thead th{
  background:#fafafa;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;font-size:.75rem;
  text-align:left;padding:14px 16px;border-bottom:1px solid var(--border);
}
.data-table tbody td{
  padding:14px 16px;border-bottom:1px solid #f0f0f3;vertical-align:top;
}
.data-table tbody tr:hover{background:#fcfcfd}
.data-table tbody tr:last-child td{border-bottom:none}
.name-cell{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{
  width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#fff0f0,#ffe4e4);
  color:var(--red);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;
}
.name-cell strong{display:block;font-size:.98rem}
.name-cell span,.muted{display:block;color:var(--soft);font-size:.85rem}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;
  font-size:.8rem;font-weight:700;background:#f4f5f7;color:var(--gray);
}
.pill.verified,.pill.completed,.pill.fulfilled{background:#eef8f1;color:var(--green)}
.pill.pending,.pill.upcoming,.pill.open{background:#fff6e6;color:var(--amber)}
.pill.running{background:#fff0f0;color:var(--red)}
.pill.rejected,.pill.cancelled,.pill.expired{background:#f4f5f7;color:#8a4b4b}
.pill.blue{background:#edf3ff;color:var(--blue)}
.action-btn,.action-btn-secondary,.action-btn-danger,.detail-btn{
  border:none;border-radius:12px;padding:11px 14px;font-weight:700;transition:all .2s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.action-btn,.detail-btn,.action-btn-danger{
  background:var(--red);color:#fff;box-shadow:0 10px 22px rgba(227,36,43,.16);
}
.action-btn:hover,.detail-btn:hover,.action-btn-danger:hover{background:var(--red-dark);transform:translateY(-1px)}
.action-btn-secondary{
  background:#fff;color:var(--ink);border:1px solid var(--border);
}
.action-btn-secondary:hover{border-color:#d4d4da;transform:translateY(-1px)}
.action-btn-danger{
  background:#b42318;
}
.action-btn-danger:hover{background:#8f1d16}
.table-actions{display:flex;gap:10px;flex-wrap:wrap}
.detail-shell{display:flex;flex-direction:column;gap:18px}
.detail-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--border);
}
.detail-head .left{display:flex;flex-direction:column;gap:10px;min-width:0}
.detail-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-title-row h2{
  font-family:var(--ff-head);font-size:1.8rem;line-height:1.1;
}
.detail-footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-top:4px;
}
.detail-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.detail-body{display:flex;flex-direction:column;gap:16px}
.detail-section{
  border:1px solid var(--border);border-radius:16px;background:#fff;padding:16px;
}
.detail-section h3{
  font-size:1rem;margin-bottom:12px;color:var(--ink);
}
.detail-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.detail-item{
  padding:13px 14px;border-radius:14px;background:#fafafa;border:1px solid #ededf2;
}
.detail-item.full{grid-column:1/-1}
.detail-item .label{
  display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;
}
.detail-item .value{color:var(--ink);word-break:break-word}
.preview-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;
}
.preview-card{
  border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;
}
.preview-card img{
  display:block;width:100%;height:180px;object-fit:cover;background:#f7f7f8;
}
.preview-card .caption{padding:12px 14px;font-weight:600}
.log-summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-bottom:10px;
}
.log-summary strong{font-size:1rem}
.log-table{min-width:720px}
.confirm-backdrop{
  position:fixed;inset:0;z-index:260;background:rgba(10,10,15,.5);
  display:none;align-items:center;justify-content:center;padding:18px;
}
.confirm-backdrop.open{display:flex}
.confirm-card{
  width:100%;max-width:520px;background:#fff;border:1px solid var(--border);border-radius:20px;
  box-shadow:0 24px 60px rgba(16,24,40,.22);overflow:hidden;
}
.confirm-header{
  padding:24px 24px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,#fff7f7 0%,#fff 100%);
}
.confirm-kicker{
  color:var(--red);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:8px;
}
.confirm-header h3{
  font-family:var(--ff-head);font-size:1.45rem;line-height:1.15;margin-bottom:8px;
}
.confirm-header p{
  color:var(--mid);line-height:1.55;
}
.confirm-actions{
  display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;
  padding:18px 24px 24px;background:#fcfcfc;
}
.confirm-actions .action-btn-secondary,
.confirm-actions .action-btn-danger{
  min-width:140px;
}
.section-hidden{display:none!important}
@media (max-width: 1180px){
  .workspace{grid-template-columns:1fr}
  .side-card{position:static}
}
@media (max-width: 860px){
  .topbar{padding:12px 16px;flex-wrap:wrap}
  .profile-shell{min-width:unset;width:100%}
  .main-nav{width:100%;justify-content:flex-start}
  .page{padding:18px 14px 40px}
  .panel,.side-card{padding:16px}
  .detail-grid{grid-template-columns:1fr}
  .detail-head{align-items:flex-start}
}
@media (max-width: 720px){
  .main-nav button{padding:9px 12px}
  .toolbar{padding-bottom:14px;margin-bottom:14px}
  .search-shell,.toolbar-actions{width:100%}
  .toolbar-actions .clear-btn{width:100%}
  .detail-footer,.detail-actions{width:100%}
  .detail-actions .btn,.detail-actions .action-btn,.detail-actions .action-btn-secondary,.detail-actions .action-btn-danger{width:100%}
  .record-card{flex-direction:column}
  .record-card-actions{width:100%;justify-content:flex-start;flex-wrap:wrap}
  .record-card-actions .detail-btn{width:100%}
  .data-table{min-width:760px}
  .preview-card img{height:160px}
  .confirm-actions{justify-content:stretch}
  .confirm-actions .action-btn-secondary,
  .confirm-actions .action-btn-danger{width:100%;min-width:0}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#organizations" id="brandLink" aria-label="SaveABeat home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg>
    <span>SaveABeat</span>
  </a>
  <nav class="main-nav" role="tablist" aria-label="Admin sections">
    <button type="button" class="active" data-section="organizations" role="tab" aria-selected="true">Organizations</button>
    <button type="button" data-section="donors" role="tab" aria-selected="false">Donors</button>
    <button type="button" data-section="campaigns" role="tab" aria-selected="false">Campaigns</button>
    <button type="button" data-section="requests" role="tab" aria-selected="false">Blood Requests</button>
  </nav>
  <div class="profile-shell" id="profileShell">
    <button class="profile-trigger" id="profileTrigger" type="button" aria-haspopup="menu" aria-expanded="false">
      <span class="profile-trigger-left">
        <span class="profile-initial" id="profileInitial">A</span>
        <span class="profile-name" id="profileName">Admin</span>
      </span>
      <span class="profile-arrow" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </button>
    <div class="profile-menu" id="profileMenu" role="menu" aria-label="Profile menu">
      <button type="button" id="logoutBtn" role="menuitem">Logout</button>
    </div>
  </div>
</header>

<main class="page">
  <section class="page-head">
    <div>
      <h1 id="sectionTitle">Organizations</h1>
    </div>
    <div class="notice info" id="notice" hidden></div>
  </section>

  <div class="workspace">
    <aside class="side-card">
      <div class="subnav" id="subnav"></div>
    </aside>

    <section class="panel">
      <div class="toolbar" id="toolbar"></div>
      <div id="content"></div>
    </section>
  </div>
</main>

<div class="confirm-backdrop" id="confirmBackdrop" hidden aria-hidden="true">
  <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="confirm-header">
      <div class="confirm-kicker">Please confirm</div>
      <h3 id="confirmTitle">Confirm action</h3>
      <p id="confirmMessage"></p>
    </div>
    <div class="confirm-actions">
      <button type="button" class="action-btn-secondary" data-action="confirm-cancel">Cancel</button>
      <button type="button" class="action-btn-danger" data-action="confirm-accept" id="confirmAcceptBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
const AUTH_KEY = 'saveabeatUser';
const SECTION_CONFIG = {
  organizations: {
    title: 'Organizations',
    api: '/api/admin/organizations',
    detailApi: (id) => `/api/admin/organizations/${id}`,
    verifyApi: (id) => `/api/admin/organizations/${id}/verify`,
    deleteApi: (id) => `/api/admin/organizations/${id}`,
    queryKey: 'status',
    searchPlaceholder: 'Search by organization name',
    listLabel: 'organization',
    subsections: [
      { id: 'verified', label: 'Verified', value: 'verified' },
      { id: 'nonverified', label: 'Non-Verified', value: 'nonverified' },
    ],
  },
  donors: {
    title: 'Donors',
    api: '/api/admin/donors',
    detailApi: (id) => `/api/admin/donors/${id}`,
    verifyApi: (id) => `/api/admin/donors/${id}/verify`,
    deleteApi: (id) => `/api/admin/donors/${id}`,
    queryKey: 'status',
    searchPlaceholder: 'Search by donor name',
    listLabel: 'donor',
    subsections: [
      { id: 'verified', label: 'Verified', value: 'verified' },
      { id: 'nonverified', label: 'Non-Verified', value: 'nonverified' },
    ],
  },
  campaigns: {
    title: 'Campaigns',
    api: '/api/admin/campaigns',
    detailApi: (id) => `/api/admin/campaigns/${id}`,
    queryKey: 'section',
    searchPlaceholder: 'Search by organization name',
    listLabel: 'campaign',
    subsections: [
      { id: 'upcoming', label: 'Upcoming', value: 'upcoming' },
      { id: 'running', label: 'Running', value: 'running' },
      { id: 'completed', label: 'Completed', value: 'completed' },
    ],
  },
  requests: {
    title: 'Blood Requests',
    api: '/api/admin/requests',
    detailApi: (id) => `/api/admin/requests/${id}`,
    queryKey: 'section',
    searchPlaceholder: 'Search by organization name',
    listLabel: 'request',
    subsections: [
      { id: 'open', label: 'Open', value: 'open' },
      { id: 'completed', label: 'Completed', value: 'completed' },
    ],
  },
};

const state = {
  user: null,
  activeSection: getInitialSection(),
  activeSubsections: {
    organizations: 'verified',
    donors: 'verified',
    campaigns: 'upcoming',
    requests: 'open',
  },
  searchTerms: {
    organizations: '',
    donors: '',
    campaigns: '',
    requests: '',
  },
  listLoading: false,
  listError: '',
  detailLoading: false,
  detailError: '',
  viewMode: 'list',
  currentItems: [],
  currentCount: 0,
  detail: null,
  confirmDialog: {
    open: false,
    title: '',
    message: '',
    confirmLabel: 'Confirm',
    resolve: null,
  },
};

const requestTokens = { list: 0, detail: 0 };
const searchTimers = {};
let noticeTimer = null;

function getInitialSection() {
  const hash = String(location.hash || '').replace('#', '').trim().toLowerCase();
  return SECTION_CONFIG[hash] ? hash : 'organizations';
}

function redirectToLogin() {
  localStorage.removeItem(AUTH_KEY);
  sessionStorage.removeItem(AUTH_KEY);
  location.replace('login.html?role=admin');
}

function getStoredUser() {
  try {
    const saved = localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY);
    const parsed = JSON.parse(saved || 'null');
    if (!parsed || parsed.role !== 'admin') {
      return null;
    }
    return parsed;
  } catch (_error) {
    return null;
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function initialForName(value) {
  const text = String(value || '').trim();
  return text ? text.charAt(0).toUpperCase() : 'A';
}

function formatDate(value) {
  if (!value) return '-';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function normalizeDonorStatus(status) {
  const value = String(status || 'Pending').trim().toLowerCase();
  if (value === 'verified' || value === 'approved') return 'Verified';
  if (value === 'rejected') return 'Rejected';
  return 'Pending';
}

function normalizeOrganizationStatus(item) {
  if (item?.verified) return 'Verified';
  const value = String(item?.verification_status || 'Pending').trim().toLowerCase();
  if (value === 'approved' || value === 'verified') return 'Verified';
  if (value === 'rejected') return 'Rejected';
  return 'Pending';
}

function campaignSectionLabel(section) {
  const value = String(section || '').toLowerCase();
  if (value === 'upcoming') return 'Upcoming';
  if (value === 'running') return 'Running';
  return 'Completed';
}

function requestStatusLabel(status) {
  const value = String(status || '').toLowerCase();
  if (value === 'open') return 'Open';
  if (value === 'fulfilled') return 'Completed';
  if (value === 'expired') return 'Expired';
  if (value === 'cancelled') return 'Cancelled';
  return value ? value.charAt(0).toUpperCase() + value.slice(1) : 'Open';
}

function requestStatusClass(status) {
  const value = String(status || '').toLowerCase();
  if (value === 'fulfilled') return 'fulfilled';
  if (value === 'open') return 'open';
  if (value === 'expired') return 'expired';
  if (value === 'cancelled') return 'cancelled';
  return 'open';
}

function sectionConfig(section) {
  return SECTION_CONFIG[section];
}

function activeSubsection(section = state.activeSection) {
  return state.activeSubsections[section];
}

function subsectionValue(section, subsectionId) {
  const config = sectionConfig(section);
  return config.subsections.find((item) => item.id === subsectionId)?.value || subsectionId;
}

function subsectionLabel(section, subsectionId) {
  const config = sectionConfig(section);
  return config.subsections.find((item) => item.id === subsectionId)?.label || subsectionId;
}

function showNotice(message, type = 'success') {
  const el = document.getElementById('notice');
  if (!el) return;
  el.className = `notice ${type}`;
  el.textContent = message;
  el.hidden = !message;
  clearTimeout(noticeTimer);
  if (message) {
    noticeTimer = window.setTimeout(() => {
      el.hidden = true;
      el.textContent = '';
    }, 4500);
  }
}

function buildQuery(params = {}) {
  const user = state.user || getStoredUser();
  const query = new URLSearchParams({
    email: user?.email || '',
    role: 'admin',
    ...params,
  });
  return query.toString();
}

async function apiFetch(path, { method = 'GET', query = {}, body = null } = {}) {
  const url = Object.keys(query).length ? `${path}?${buildQuery(query)}` : `${path}?${buildQuery()}`;
  const response = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === null ? undefined : JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(payload.message || 'Request failed.');
    error.status = response.status;
    error.payload = payload;
    throw error;
  }
  return payload;
}

function renderTopNavigation() {
  document.querySelectorAll('.main-nav button').forEach((button) => {
    const active = button.dataset.section === state.activeSection;
    button.classList.toggle('active', active);
    button.setAttribute('aria-selected', String(active));
  });
}

function renderSectionHeader() {
  const config = sectionConfig(state.activeSection);
  document.getElementById('sectionTitle').textContent = config.title;
}

function renderSubnav() {
  const container = document.getElementById('subnav');
  const config = sectionConfig(state.activeSection);
  const current = activeSubsection();
  container.innerHTML = config.subsections.map((subsection) => `
    <button type="button" class="${subsection.id === current ? 'active' : ''}" data-subsection="${escapeHtml(subsection.id)}">
      ${escapeHtml(subsection.label)}
    </button>
  `).join('');
}

function renderToolbar() {
  const container = document.getElementById('toolbar');
  if (state.viewMode === 'detail') {
    container.innerHTML = '';
    return;
  }

  const config = sectionConfig(state.activeSection);
  const searchValue = state.searchTerms[state.activeSection] || '';
  const disabled = searchValue ? '' : 'disabled';
  container.innerHTML = `
    <div class="search-shell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" data-search-input placeholder="${escapeHtml(config.searchPlaceholder)}" value="${escapeHtml(searchValue)}" autocomplete="off" />
    </div>
    <div class="toolbar-actions">
      <button type="button" class="clear-btn" data-action="clear-search" ${disabled}>Clear</button>
      <div class="results-meta">${state.listLoading ? 'Loading results...' : `${state.currentCount} result${state.currentCount === 1 ? '' : 's'}`}</div>
    </div>
  `;
}

function updateToolbarMeta() {
  const container = document.getElementById('toolbar');
  if (!container || state.viewMode === 'detail') {
    return;
  }

  const clearButton = container.querySelector('[data-action="clear-search"]');
  const results = container.querySelector('.results-meta');
  if (clearButton) {
    clearButton.disabled = !String(state.searchTerms[state.activeSection] || '').trim();
  }
  if (results) {
    results.textContent = state.listLoading
      ? 'Loading results...'
      : `${state.currentCount} result${state.currentCount === 1 ? '' : 's'}`;
  }
}

function renderConfirmDialog() {
  const backdrop = document.getElementById('confirmBackdrop');
  const title = document.getElementById('confirmTitle');
  const message = document.getElementById('confirmMessage');
  const acceptBtn = document.getElementById('confirmAcceptBtn');
  if (!backdrop || !title || !message || !acceptBtn) {
    return;
  }

  backdrop.classList.toggle('open', state.confirmDialog.open);
  backdrop.hidden = !state.confirmDialog.open;
  backdrop.setAttribute('aria-hidden', String(!state.confirmDialog.open));
  title.textContent = state.confirmDialog.title || 'Confirm action';
  message.textContent = state.confirmDialog.message || '';
  acceptBtn.textContent = state.confirmDialog.confirmLabel || 'Confirm';

  if (state.confirmDialog.open) {
    window.requestAnimationFrame(() => {
      if (!state.confirmDialog.open) return;
      const cancelBtn = backdrop.querySelector('[data-action="confirm-cancel"]');
      cancelBtn?.focus();
    });
  }
}

function askConfirm({ title, message, confirmLabel }) {
  return new Promise((resolve) => {
    state.confirmDialog = {
      open: true,
      title: title || 'Confirm action',
      message: message || '',
      confirmLabel: confirmLabel || 'Confirm',
      resolve,
    };
    renderConfirmDialog();
  });
}

function closeConfirmDialog(result = false) {
  const resolve = state.confirmDialog.resolve;
  state.confirmDialog = {
    open: false,
    title: '',
    message: '',
    confirmLabel: 'Confirm',
    resolve: null,
  };
  renderConfirmDialog();
  if (typeof resolve === 'function') {
    resolve(result);
  }
}

function renderListState() {
  const container = document.getElementById('content');
  const config = sectionConfig(state.activeSection);

  if (state.listLoading) {
    container.innerHTML = `<div class="loading">Loading ${escapeHtml(config.title.toLowerCase())}...</div>`;
    return;
  }

  if (state.listError) {
    container.innerHTML = `
      <div class="error-state">
        <strong>Unable to load ${escapeHtml(config.title.toLowerCase())}.</strong>
        <div style="margin-top:8px">${escapeHtml(state.listError)}</div>
        <div style="margin-top:14px">
          <button type="button" class="action-btn-secondary" data-action="retry-list">Try Again</button>
        </div>
      </div>
    `;
    return;
  }

  if (!state.currentItems.length) {
    const activeSearch = String(state.searchTerms[state.activeSection] || '').trim();
    const emptyMessage = activeSearch
      ? `No ${config.listLabel}s match "${activeSearch}".`
      : `No ${subsectionLabel(state.activeSection, activeSubsection()).toLowerCase()} ${config.listLabel}s found.`;
    container.innerHTML = `
      <div class="empty-state">
        <strong>${escapeHtml(emptyMessage)}</strong>
      </div>
    `;
    return;
  }

  if (state.activeSection === 'organizations') {
    container.innerHTML = renderOrganizationTable(state.currentItems);
    return;
  }
  if (state.activeSection === 'donors') {
    container.innerHTML = renderDonorTable(state.currentItems);
    return;
  }
  if (state.activeSection === 'campaigns') {
    container.innerHTML = renderCampaignTable(state.currentItems);
    return;
  }
  container.innerHTML = renderRequestTable(state.currentItems);
}

function pillClassForOrganization(item) {
  return normalizeOrganizationStatus(item).toLowerCase();
}

  const cards = items.map((item) => {
    const status = normalizeOrganizationStatus(item);
    const location = [item.city, item.district].filter(Boolean).join(', ') || item.address || 'Location not listed';
    return `
      <article class="record-card">
        <div class="record-card-main">
          <div class="record-card-head">
            <div class="record-card-copy">
              <strong>${escapeHtml(item.orgName || item.name || 'Organization')}</strong>
              <span>${escapeHtml(item.orgType || 'Organization')}</span>
            </div>
            <span class="pill ${escapeHtml(pillClassForOrganization(item))}">${escapeHtml(status)}</span>
          </div>
          <div class="record-card-meta">
            <span class="record-chip">${escapeHtml(location)}</span>
            <span class="record-chip">${escapeHtml(item.contact || item.phone || 'Contact not listed')}</span>
            <span class="record-chip">${escapeHtml(item.email || 'Email not listed')}</span>
          </div>
        </div>
        <div class="record-card-actions">
          <button type="button" class="detail-btn" data-action="open-detail" data-id="${escapeHtml(item.orgId || item.org_id)}">View Details</button>
        </div>
      </article>
    `;
  }).join('');

  return `<div class="record-list">${cards}</div>`;
}

function renderDonorTable(items) {
  const cards = items.map((item) => {
    const status = normalizeDonorStatus(item.verification_status);
    const location = [item.city, item.district].filter(Boolean).join(', ') || item.address || 'Location not listed';
    return `
      <article class="record-card">
        <div class="record-card-main">
          <div class="record-card-head">
            <div class="record-card-copy">
              <strong>${escapeHtml(item.fullName || item.full_name || 'Donor')}</strong>
              <span>${escapeHtml(item.bloodGroup || item.blood_group || 'Blood group not listed')}</span>
            </div>
            <span class="pill ${status.toLowerCase()}">${escapeHtml(status)}</span>
          </div>
          <div class="record-card-meta">
            <span class="record-chip">${escapeHtml(location)}</span>
            <span class="record-chip">${escapeHtml(item.email || 'Email not listed')}</span>
            <span class="record-chip">${escapeHtml(formatDate(item.created_at))}</span>
          </div>
        </div>
        <div class="record-card-actions">
          <button type="button" class="detail-btn" data-action="open-detail" data-id="${escapeHtml(item.user_id || item.userId)}">View Details</button>
        </div>
      </article>
    `;
  }).join('');

  return `<div class="record-list">${cards}</div>`;
}

function renderCampaignTable(items) {
  const cards = items.map((item) => {
    const requirements = Array.isArray(item.bloodRequirements) && item.bloodRequirements.length
      ? item.bloodRequirements.map((req) => `${req.bloodGroup || req.blood_group} ${Number(req.unitsRequired || req.units_required || 0)}u`).join(', ')
      : item.bloodGroupNeeded || item.blood_group_needed || '—';
    const statusLabel = campaignSectionLabel(item.section || item.kind || item.status);
    const statusClass = String(item.section || item.status || '').toLowerCase();
    return `
      <article class="record-card">
        <div class="record-card-main">
          <div class="record-card-head">
            <div class="record-card-copy">
              <strong>${escapeHtml(item.title || 'Campaign')}</strong>
              <span>${escapeHtml(item.eventType || item.type || 'Campaign')}</span>
            </div>
            <span class="pill ${escapeHtml(statusClass)}">${escapeHtml(statusLabel)}</span>
          </div>
          <div class="record-card-meta">
            <span class="record-chip">${escapeHtml(item.orgName || item.org || 'Organization not listed')}</span>
            <span class="record-chip">${escapeHtml(formatDate(item.date || item.event_date))}</span>
            <span class="record-chip">${escapeHtml(item.time || item.time_range || 'Time not listed')}</span>
            <span class="record-chip">${escapeHtml(item.location || 'Location not listed')}</span>
            <span class="record-chip">${escapeHtml(requirements)}</span>
          </div>
        </div>
        <div class="record-card-actions">
          <button type="button" class="detail-btn" data-action="open-detail" data-id="${escapeHtml(item.id || item.event_id)}">View</button>
        </div>
      </article>
    `;
  }).join('');

  return `<div class="record-list">${cards}</div>`;
}

function renderRequestTable(items) {
  const cards = items.map((item) => {
    const status = requestStatusLabel(item.status);
    const statusClass = requestStatusClass(item.status);
    const location = item.hospitalAddress || item.location || [item.city, item.district].filter(Boolean).join(', ') || '—';
    const dateValue = item.displayDate || item.requiredBy || item.expiresAt || item.createdAt;
    return `
      <article class="record-card">
        <div class="record-card-main">
          <div class="record-card-head">
            <div class="record-card-copy">
              <strong>${escapeHtml(item.orgName || 'Organization')}</strong>
              <span>${escapeHtml(item.hospitalName || 'Blood request')}</span>
            </div>
            <span class="pill ${escapeHtml(statusClass)}">${escapeHtml(status)}</span>
          </div>
          <div class="record-card-meta">
            <span class="record-chip">${escapeHtml(item.bloodGroup || 'Blood group not listed')}</span>
            <span class="record-chip">${escapeHtml(String(item.unitsNeeded ?? item.units_needed ?? '—'))} units</span>
            <span class="record-chip">${escapeHtml(item.urgency || 'normal')}</span>
            <span class="record-chip">${escapeHtml(location)}</span>
            <span class="record-chip">${escapeHtml(formatDate(dateValue))}</span>
          </div>
        </div>
        <div class="record-card-actions">
          <button type="button" class="detail-btn" data-action="open-detail" data-id="${escapeHtml(item.requestId || item.request_id)}">View</button>
        </div>
      </article>
    `;
  }).join('');

  return `<div class="record-list">${cards}</div>`;
}

function renderField(label, value, full = false, allowHtml = false) {
  if (value === null || value === undefined || value === '') {
    return '';
  }
  const safeValue = allowHtml ? value : escapeHtml(String(value));
  return `
    <div class="detail-item ${full ? 'full' : ''}">
      <span class="label">${escapeHtml(label)}</span>
      <div class="value">${safeValue}</div>
    </div>
  `;
}

function renderDetailSection(title, items) {
  const content = items.filter(Boolean).join('');
  if (!content) return '';
  return `
    <section class="detail-section">
      <h3>${escapeHtml(title)}</h3>
      <div class="detail-grid">${content}</div>
    </section>
  `;
}

function renderPreviewCard(src, name, fallbackText = 'Preview') {
  if (!src) return '';
  return `
    <div class="preview-card">
      <img src="${escapeHtml(src)}" alt="${escapeHtml(name || fallbackText)}" />
      <div class="caption">${escapeHtml(name || fallbackText)}</div>
    </div>
  `;
}

function renderOrganizationDetail(detail) {
  const status = normalizeOrganizationStatus(detail);
  const isVerified = status === 'Verified';
  const name = detail.orgName || detail.name || 'Organization';
  const sections = [
    renderDetailSection('Registration information', [
      renderField('Organization name', name),
      renderField('Email', detail.email),
      renderField('Phone', detail.phone || detail.contact),
      renderField('Organization type', detail.orgType || detail.org_type),
      renderField('Address', detail.address || detail.org_address),
      renderField('City', detail.city),
      renderField('District', detail.district),
      renderField('Verification status', `<span class="pill ${status.toLowerCase()}">${escapeHtml(status)}</span>`, false, true),
      renderField('Created at', formatDate(detail.created_at)),
    ]),
    renderDetailSection('Verification documents', [
      renderField('Document type', detail.verification_document_type),
      renderField('Document name', detail.verification_document_name),
      renderField('Additional documents', detail.verification_documents_name),
      renderField('Building photo', detail.building_photo_name),
    ]),
  ].filter(Boolean).join('');

  const media = [];
  if (detail.building_photo) media.push(renderPreviewCard(detail.building_photo, detail.building_photo_name || 'Building photo', 'Building photo'));
  if (detail.verification_document_file) media.push(renderPreviewCard(detail.verification_document_file, detail.verification_document_name || 'Verification document', 'Verification document'));
  if (detail.verification_documents) media.push(renderPreviewCard(detail.verification_documents, detail.verification_documents_name || 'Additional documents', 'Additional documents'));

  return `
    <div class="detail-shell">
      <div class="detail-head">
        <div class="left">
          <div class="detail-title-row">
            <h2>${escapeHtml(name)}</h2>
            <span class="pill ${status.toLowerCase()}">${escapeHtml(status)}</span>
          </div>
        </div>
      </div>
      ${media.length ? `<div class="preview-grid">${media.join('')}</div>` : ''}
      <div class="detail-body">${sections}</div>
      <div class="detail-footer">
        <div class="detail-actions">
          ${isVerified ? '<button type="button" class="action-btn-danger" data-action="remove-user">Remove User</button>' : '<button type="button" class="action-btn" data-action="verify">Verify</button><button type="button" class="action-btn-danger" data-action="delete">Delete</button>'}
          <button type="button" class="action-btn-secondary" data-action="close-detail">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderDonorDetail(detail) {
  const status = normalizeDonorStatus(detail.verification_status);
  const isVerified = status === 'Verified';
  const name = detail.fullName || detail.full_name || 'Donor';
  const sections = [
    renderDetailSection('Registration information', [
      renderField('Full name', name),
      renderField('Email', detail.email),
      renderField('Phone', detail.phone),
      renderField('Address', detail.address),
      renderField('City', detail.city),
      renderField('District', detail.district),
      renderField('Blood group', detail.bloodGroup || detail.blood_group),
      renderField('Availability', detail.is_available === false ? 'No' : (detail.is_available === true ? 'Yes' : '-')),
      renderField('Total donations', detail.total_donations),
      renderField('Last donated at', detail.last_donated_at ? formatDate(detail.last_donated_at) : '-'),
      renderField('Created at', formatDate(detail.created_at)),
    ]),
    renderDetailSection('Verification status', [
      renderField('Verification status', `<span class="pill ${status.toLowerCase()}">${escapeHtml(status)}</span>`, false, true),
    ]),
    renderDetailSection('Verification documents', [
      renderField('Document type', detail.blood_verification_document_type),
      renderField('Document name', detail.blood_verification_document_name),
    ]),
  ].filter(Boolean).join('');

  const media = [];
  if (detail.profile_picture || detail.profile_image_data) media.push(renderPreviewCard(detail.profile_picture || detail.profile_image_data, detail.profile_picture_name || detail.profile_image_name || 'Profile picture', 'Profile picture'));
  if (detail.blood_verification_document_file) media.push(renderPreviewCard(detail.blood_verification_document_file, detail.blood_verification_document_name || 'Verification document', 'Verification document'));

  return `
    <div class="detail-shell">
      <div class="detail-head">
        <div class="left">
          <div class="detail-title-row">
            <h2>${escapeHtml(name)}</h2>
            <span class="pill ${status.toLowerCase()}">${escapeHtml(status)}</span>
          </div>
        </div>
      </div>
      ${media.length ? `<div class="preview-grid">${media.join('')}</div>` : ''}
      <div class="detail-body">${sections}</div>
      <div class="detail-footer">
        <div class="detail-actions">
          ${isVerified ? '<button type="button" class="action-btn-danger" data-action="remove-user">Remove User</button>' : '<button type="button" class="action-btn" data-action="verify">Verify</button><button type="button" class="action-btn-danger" data-action="delete">Delete</button>'}
          <button type="button" class="action-btn-secondary" data-action="close-detail">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderBloodLog(items, totalUnits, emptyMessage) {
  if (!items.length) {
    return `<div class="empty-state">${escapeHtml(emptyMessage)}</div>`;
  }
  const rows = items.map((item) => `
    <tr>
      <td>${escapeHtml(item.donorName || item.donor_name || item.applicantName || 'Unknown')}</td>
      <td>${escapeHtml(item.bloodGroup || item.blood_group || '—')}</td>
      <td>${escapeHtml(String(item.units ?? item.units_donated ?? '—'))}</td>
    </tr>
  `).join('');
  return `
    <div class="detail-section">
      <div class="log-summary">
        <h3>Donation Log</h3>
        <strong>Total Units Collected: ${escapeHtml(String(totalUnits || 0))}</strong>
      </div>
      <div class="table-shell">
        <table class="data-table log-table">
          <thead>
            <tr>
              <th>Donor</th>
              <th>Blood Type</th>
              <th>Units</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderCampaignDetail(detail) {
  const section = String(detail.section || '').toLowerCase();
  const statusLabel = campaignSectionLabel(section);
  const requirements = Array.isArray(detail.bloodRequirements) ? detail.bloodRequirements : [];
  const requirementItems = requirements.map((req) => renderField(`${req.bloodGroup || req.blood_group}`, `${Number(req.unitsRequired || req.units_required || 0)} unit${Number(req.unitsRequired || req.units_required || 0) === 1 ? '' : 's'}`));
  const sections = [
    renderDetailSection('Campaign information', [
      renderField('Title', detail.title),
      renderField('Organization', detail.orgName || detail.org || '-'),
      renderField('Location', detail.location),
      renderField('Date', formatDate(detail.date || detail.event_date)),
      renderField('Time', detail.time || detail.time_range),
      renderField('Type', detail.type || detail.event_type),
      renderField('Status', `<span class="pill ${section}">${escapeHtml(statusLabel)}</span>`, false, true),
    ]),
    renderDetailSection('Blood requirements', requirementItems.length ? requirementItems : [
      renderField('Blood groups required', detail.bloodGroupNeeded || detail.blood_group_needed || '-', true),
    ]),
  ].filter(Boolean).join('');

  const logSection = section === 'upcoming'
    ? ''
    : renderBloodLog(detail.donationLog || [], detail.totalUnitsCollected || 0, 'No completed donations recorded yet.');

  return `
    <div class="detail-shell">
      <div class="detail-head">
        <div class="left">
          <div class="detail-title-row">
            <h2>${escapeHtml(detail.title || 'Campaign')}</h2>
            <span class="pill ${section}">${escapeHtml(statusLabel)}</span>
          </div>
        </div>
      </div>
      <div class="detail-body">${sections}${logSection ? logSection : ''}</div>
      <div class="detail-footer">
        <div class="detail-actions">
          <button type="button" class="action-btn-secondary" data-action="close-detail">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderRequestDetail(detail) {
  const status = String(detail.status || '').toLowerCase();
  const statusLabel = requestStatusLabel(status);
  const sections = [
    renderDetailSection('Request information', [
      renderField('Organization', detail.orgName || detail.org || '-'),
      renderField('Hospital name', detail.hospitalName || detail.hospital_name),
      renderField('Blood group', detail.bloodGroup || detail.blood_group),
      renderField('Units needed', detail.unitsNeeded || detail.units_needed),
      renderField('Urgency', detail.urgency),
      renderField('Status', `<span class="pill ${requestStatusClass(status)}">${escapeHtml(statusLabel)}</span>`, false, true),
      renderField('Required by', detail.requiredBy ? formatDate(detail.requiredBy) : '-'),
      renderField('Created date', formatDate(detail.createdAt)),
    ]),
    renderDetailSection('Location and contact', [
      renderField('Hospital address', detail.hospitalAddress || detail.hospital_address),
      renderField('City', detail.city),
      renderField('District', detail.district),
      renderField('Contact person', detail.contactPerson || detail.contact_person),
      renderField('Contact number', detail.contactNumber || detail.contact_number),
      renderField('Patient type', detail.patientType || detail.patient_type),
    ]),
    renderDetailSection('Additional notes', [
      renderField('Additional note', detail.additionalNote || detail.additional_note || '-', true),
    ]),
  ].filter(Boolean).join('');

  const donationLog = Array.isArray(detail.donationLog) ? detail.donationLog : [];
  const logSection = donationLog.length ? renderBloodLog(donationLog, detail.totalUnitsCollected || 0, 'No confirmed donations recorded yet.') : '';

  return `
    <div class="detail-shell">
      <div class="detail-head">
        <div class="left">
          <div class="detail-title-row">
            <h2>${escapeHtml(detail.hospitalName || 'Blood request')}</h2>
            <span class="pill ${requestStatusClass(status)}">${escapeHtml(statusLabel)}</span>
          </div>
        </div>
      </div>
      <div class="detail-body">${sections}${logSection}</div>
      <div class="detail-footer">
        <div class="detail-actions">
          <button type="button" class="action-btn-secondary" data-action="close-detail">Close</button>
        </div>
      </div>
    </div>
  `;
}

function renderContent() {
  renderTopNavigation();
  renderSectionHeader();
  renderSubnav();
  renderToolbar();
  const container = document.getElementById('content');

  if (state.viewMode === 'detail') {
    if (state.detailLoading) {
      container.innerHTML = '<div class="loading">Loading details...</div>';
      return;
    }
    if (state.detailError) {
      container.innerHTML = `
        <div class="error-state">
          <strong>Unable to load details.</strong>
          <div style="margin-top:8px">${escapeHtml(state.detailError)}</div>
          <div style="margin-top:14px">
            <button type="button" class="action-btn-secondary" data-action="close-detail">Close</button>
          </div>
        </div>
      `;
      return;
    }
    if (!state.detail) {
      container.innerHTML = '<div class="loading">Loading details...</div>';
      return;
    }

    if (state.activeSection === 'organizations') {
      container.innerHTML = renderOrganizationDetail(state.detail);
      return;
    }
    if (state.activeSection === 'donors') {
      container.innerHTML = renderDonorDetail(state.detail);
      return;
    }
    if (state.activeSection === 'campaigns') {
      container.innerHTML = renderCampaignDetail(state.detail);
      return;
    }
    container.innerHTML = renderRequestDetail(state.detail);
    return;
  }

  renderListState();
}

async function loadActiveList() {
  const section = state.activeSection;
  const config = sectionConfig(section);
  const subsectionId = activeSubsection(section);
  const subsection = config.subsections.find((item) => item.id === subsectionId) || config.subsections[0];
  const token = ++requestTokens.list;
  state.listLoading = true;
  state.listError = '';
  state.currentItems = [];
  state.currentCount = 0;
  updateToolbarMeta();
  renderListState();

  try {
    const payload = await apiFetch(config.api, {
      query: {
        [config.queryKey]: subsection.value,
        search: state.searchTerms[section] || '',
      },
    });
    if (token !== requestTokens.list) return;
    state.currentItems = Array.isArray(payload.data) ? payload.data : [];
    state.currentCount = state.currentItems.length;
    state.listLoading = false;
    updateToolbarMeta();
    renderListState();
  } catch (error) {
    if (token !== requestTokens.list) return;
    state.listLoading = false;
    state.listError = error.message || 'Unable to load records.';
    updateToolbarMeta();
    renderListState();
  }
}

function normalizeDetailData(section, payload) {
  const data = payload?.data ?? payload?.organization ?? payload?.donor ?? payload?.campaign ?? payload?.request ?? payload;
  if (section === 'campaigns' || section === 'requests') {
    return data || null;
  }
  return data || null;
}

async function openDetail(itemId) {
  const section = state.activeSection;
  const config = sectionConfig(section);
  const token = ++requestTokens.detail;
  state.viewMode = 'detail';
  state.detailLoading = true;
  state.detailError = '';
  state.detail = null;
  renderContent();

  try {
    const payload = await apiFetch(config.detailApi(itemId));
    if (token !== requestTokens.detail) return;
    state.detail = normalizeDetailData(section, payload);
    state.detailLoading = false;
    renderContent();
  } catch (error) {
    if (token !== requestTokens.detail) return;
    state.detailLoading = false;
    state.detailError = error.message || 'Unable to load details.';
    renderContent();
  }
}

function backToList() {
  state.viewMode = 'list';
  state.detail = null;
  state.detailError = '';
  renderContent();
}

function setActiveSection(section) {
  if (!SECTION_CONFIG[section]) return;
  state.activeSection = section;
  state.viewMode = 'list';
  state.detail = null;
  state.detailError = '';
  clearTimeout(searchTimers[section]);
  history.replaceState(null, '', `#${section}`);
  renderContent();
  loadActiveList();
}

function setActiveSubsection(subsectionId) {
  state.activeSubsections[state.activeSection] = subsectionId;
  state.viewMode = 'list';
  state.detail = null;
  state.detailError = '';
  renderContent();
  loadActiveList();
}

function scheduleSearchLoad(section = state.activeSection) {
  clearTimeout(searchTimers[section]);
  searchTimers[section] = window.setTimeout(() => {
    if (state.activeSection !== section || state.viewMode !== 'list') {
      return;
    }
    loadActiveList();
  }, 220);
}

async function verifyOrganization(detail) {
  const name = detail.orgName || detail.name || 'this organization';
  const confirmed = await askConfirm({
    title: 'Verify Organization',
    message: `Verify ${name}? This will mark the organization as verified and send a confirmation email to the registered account.`,
    confirmLabel: 'Verify',
  });
  if (!confirmed) return;
  try {
    const payload = await apiFetch(SECTION_CONFIG.organizations.verifyApi(detail.orgId || detail.org_id), {
      method: 'POST',
      body: { email: state.user.email, role: 'admin', action: 'approve' },
    });
    showNotice(payload.message || 'Organization verified successfully.', 'success');
    state.activeSubsections.organizations = 'verified';
    backToList();
    await loadActiveList();
  } catch (error) {
    showNotice(error.message || 'Unable to verify organization.', 'error');
  }
}

async function deleteOrganization(detail, removeOnly = false) {
  const name = detail.orgName || detail.name || 'this organization';
  const confirmed = await askConfirm({
    title: removeOnly ? 'Remove User' : 'Delete Organization',
    message: removeOnly
      ? `Remove this user? This will permanently remove the user account from SaveABeat. This action cannot be undone.`
      : `Delete ${name}? This will permanently remove the organization and its linked user account from SaveABeat. This action cannot be undone.`,
    confirmLabel: removeOnly ? 'Remove User' : 'Delete',
  });
  if (!confirmed) return;
  try {
    const payload = await apiFetch(SECTION_CONFIG.organizations.deleteApi(detail.orgId || detail.org_id), {
      method: 'DELETE',
      body: { email: state.user.email, role: 'admin' },
    });
    showNotice(payload.message || 'Organization deleted successfully.', 'success');
    backToList();
    await loadActiveList();
  } catch (error) {
    showNotice(error.message || 'Unable to delete organization.', 'error');
  }
}

async function verifyDonor(detail) {
  const name = detail.fullName || detail.full_name || 'this donor';
  const confirmed = await askConfirm({
    title: 'Verify Donor',
    message: `Verify ${name}? This will mark the donor as verified and send a confirmation email to the registered account.`,
    confirmLabel: 'Verify',
  });
  if (!confirmed) return;
  try {
    const payload = await apiFetch(SECTION_CONFIG.donors.verifyApi(detail.user_id || detail.userId), {
      method: 'POST',
      body: { email: state.user.email, role: 'admin', action: 'approve' },
    });
    showNotice(payload.message || 'Donor verified successfully.', 'success');
    state.activeSubsections.donors = 'verified';
    backToList();
    await loadActiveList();
  } catch (error) {
    showNotice(error.message || 'Unable to verify donor.', 'error');
  }
}

async function deleteDonor(detail, removeOnly = false) {
  const name = detail.fullName || detail.full_name || 'this donor';
  const confirmed = await askConfirm({
    title: removeOnly ? 'Remove User' : 'Delete Donor',
    message: removeOnly
      ? `Remove this user? This will permanently remove the user account from SaveABeat. This action cannot be undone.`
      : `Delete ${name}? This will permanently remove the donor and linked user account from SaveABeat. This action cannot be undone.`,
    confirmLabel: removeOnly ? 'Remove User' : 'Delete',
  });
  if (!confirmed) return;
  try {
    const payload = await apiFetch(SECTION_CONFIG.donors.deleteApi(detail.user_id || detail.userId), {
      method: 'DELETE',
      body: { email: state.user.email, role: 'admin' },
    });
    showNotice(payload.message || 'Donor deleted successfully.', 'success');
    backToList();
    await loadActiveList();
  } catch (error) {
    showNotice(error.message || 'Unable to delete donor.', 'error');
  }
}

async function handleDetailAction(action) {
  const detail = state.detail;
  if (!detail) return;

  if (action === 'close-detail') {
    backToList();
    return;
  }

  if (state.activeSection === 'organizations') {
    if (action === 'verify') {
      await verifyOrganization(detail);
      return;
    }
    if (action === 'delete') {
      await deleteOrganization(detail, false);
      return;
    }
    if (action === 'remove-user') {
      await deleteOrganization(detail, true);
      return;
    }
    return;
  }

  if (state.activeSection === 'donors') {
    if (action === 'verify') {
      await verifyDonor(detail);
      return;
    }
    if (action === 'delete') {
      await deleteDonor(detail, false);
      return;
    }
    if (action === 'remove-user') {
      await deleteDonor(detail, true);
      return;
    }
  }
}

function ensureProfileMenuClosed() {
  const menu = document.getElementById('profileMenu');
  const shell = document.getElementById('profileShell');
  const trigger = document.getElementById('profileTrigger');
  menu?.classList.remove('open');
  shell?.classList.remove('open');
  trigger?.setAttribute('aria-expanded', 'false');
}

function toggleProfileMenu() {
  const menu = document.getElementById('profileMenu');
  const shell = document.getElementById('profileShell');
  const trigger = document.getElementById('profileTrigger');
  const isOpen = menu.classList.toggle('open');
  shell?.classList.toggle('open', isOpen);
  trigger?.setAttribute('aria-expanded', String(isOpen));
}

function logout() {
  localStorage.removeItem(AUTH_KEY);
  sessionStorage.removeItem(AUTH_KEY);
  location.replace('index.html');
}

function attachEvents() {
  const toolbar = document.getElementById('toolbar');
  const confirmBackdrop = document.getElementById('confirmBackdrop');

  document.querySelectorAll('.main-nav button').forEach((button) => {
    button.addEventListener('click', () => setActiveSection(button.dataset.section));
  });

  document.getElementById('brandLink')?.addEventListener('click', (event) => {
    event.preventDefault();
    setActiveSection('organizations');
  });

  document.getElementById('profileTrigger')?.addEventListener('click', toggleProfileMenu);
  document.getElementById('logoutBtn')?.addEventListener('click', logout);

  document.getElementById('subnav')?.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-subsection]');
    if (!button) return;
    setActiveSubsection(button.dataset.subsection);
  });

  toolbar?.addEventListener('input', (event) => {
    const input = event.target.closest('[data-search-input]');
    if (!input) return;
    state.searchTerms[state.activeSection] = input.value;
    scheduleSearchLoad(state.activeSection);
  });

  toolbar?.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action="clear-search"]');
    if (!button) return;
    state.searchTerms[state.activeSection] = '';
    const input = toolbar.querySelector('[data-search-input]');
    if (input) {
      input.value = '';
      input.focus();
    }
    updateToolbarMeta();
    loadActiveList();
  });

  confirmBackdrop?.addEventListener('click', (event) => {
    const target = event.target instanceof Element ? event.target : null;
    const button = target?.closest('[data-action]');
    if (button?.dataset.action === 'confirm-cancel') {
      closeConfirmDialog(false);
      return;
    }
    if (button?.dataset.action === 'confirm-accept') {
      closeConfirmDialog(true);
      return;
    }
    if (event.target === confirmBackdrop) {
      closeConfirmDialog(false);
    }
  });

  document.getElementById('content')?.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    if (action === 'open-detail') {
      await openDetail(button.dataset.id);
      return;
    }
    if (action === 'retry-list') {
      loadActiveList();
      return;
    }
    await handleDetailAction(action);
  });

  document.addEventListener('click', (event) => {
    const shell = document.getElementById('profileShell');
    if (shell && !shell.contains(event.target)) {
      ensureProfileMenuClosed();
    }
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (state.confirmDialog.open) {
        closeConfirmDialog(false);
        return;
      }
      if (state.viewMode === 'detail') {
        backToList();
        return;
      }
      ensureProfileMenuClosed();
    }
  });

  window.addEventListener('hashchange', () => {
    const next = String(location.hash || '').replace('#', '').trim().toLowerCase();
    if (SECTION_CONFIG[next]) {
      setActiveSection(next);
    }
  });
}

function bootstrap() {
  state.user = getStoredUser();
  if (!state.user) {
    redirectToLogin();
    return;
  }

  document.getElementById('profileName').textContent = state.user.fullName || state.user.full_name || 'Admin';
  document.getElementById('profileInitial').textContent = initialForName(state.user.fullName || state.user.full_name || state.user.email || 'A');
  attachEvents();
  renderContent();
  loadActiveList();
}

bootstrap();
</script>
