<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SaveABeat — Select Organization Type</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23E3242B' d='M32 56s-24-14.8-24-31c0-7.2 5.4-12 12-12 4.4 0 7.4 2.3 9 4.5 1.6-2.2 4.6-4.5 9-4.5 6.6 0 12 4.8 12 12 0 16.2-24 31-24 31z'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E3242B;--red-dark:#a81e1e;--red-light:#fdecea;--ink:#1a1a1a;--mid:#555;--soft:#888;--border:#e8e8e8;--bg:#fdecea;--white:#fff;--ff-head:'Playfair Display',serif;--ff-body:'DM Sans',sans-serif}
body{font-family:var(--ff-body);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--white);border-radius:16px;padding:44px 40px;width:100%;max-width:480px;box-shadow:0 4px 32px rgba(0,0,0,.08)}
.card-logo{text-align:center;margin-bottom:24px}
.card-logo a{display:inline-flex;align-items:center;gap:8px;font-family:var(--ff-head);font-size:1.4rem;font-weight:700;color:var(--ink);text-decoration:none}
.card h2{font-family:var(--ff-head);font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:6px;color:var(--ink)}
.card .sub{text-align:center;font-size:.88rem;color:var(--soft);margin-bottom:28px;line-height:1.5}
.role-choice-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:24px}
.role-choice{width:100%;border:1px solid var(--border);background:var(--white);border-radius:10px;padding:16px 18px;cursor:pointer;text-align:left;transition:border-color .2s,transform .2s,box-shadow .2s}
.role-choice:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 4px 16px rgba(227,36,43,.12)}
.role-choice strong{display:block;font-size:1rem;color:var(--ink);margin-bottom:4px;font-weight:600}
.role-choice span{display:block;font-size:.85rem;color:var(--soft);line-height:1.4}
.card-footer{text-align:center;font-size:.85rem;color:var(--mid);margin-top:20px}
.card-footer a{color:var(--red);font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="card-logo">
    <a href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#E3242B"><path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402 0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 2.54 0 5.274 1.621 5.274 5.181 0 4.069-5.136 8.625-11 14.402z"/></svg>
      SaveABeat
    </a>
  </div>

  <h2>Select Organization Type</h2>
  <p class="sub"></p>

  <div class="role-choice-grid">
    <button class="role-choice" type="button" onclick="location.href='register.html?role=org&type=blood-bank'">
      <strong>Blood Bank</strong>
      <span>Licensed blood transfusion center.</span>
    </button>
    <button class="role-choice" type="button" onclick="location.href='register.html?role=org&type=hospital'">
      <strong>Hospital</strong>
      <span>Registered healthcare institution.</span>
    </button>
    <button class="role-choice" type="button" onclick="location.href='register.html?role=org&type=ngo'">
      <strong>NGO</strong>
      <span>Registered non-government organization.</span>
    </button>
  </div>

  <p class="card-footer">Already have an account? <a href="login.html?role=org">Sign in here</a></p>
</div>
</body>
</html>
